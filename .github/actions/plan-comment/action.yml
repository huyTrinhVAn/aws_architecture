name: Post Terraform plan comment
description: >
  Posts (or updates) one PR comment with the plan summary, the Conftest
  result and the full plan. Each Terraform root uses its own marker, so
  every root keeps exactly one comment per PR instead of overwriting the
  others or adding a new one on every push.

inputs:
  marker:
    description: Hidden HTML marker that identifies this root's comment
    required: true
  title:
    description: Comment heading
    required: true
  plan-file:
    description: Path (from the repo root) to `terraform show -no-color` output
    required: true
  policy-file:
    description: Path (from the repo root) to the Conftest output
    required: true

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        MARKER: ${{ inputs.marker }}
        TITLE: ${{ inputs.title }}
        PLAN_FILE: ${{ inputs.plan-file }}
        POLICY_FILE: ${{ inputs.policy-file }}
      with:
        script: |
          const fs = require('fs');
          const { MARKER: marker, TITLE: title, PLAN_FILE: planFile, POLICY_FILE: policyFile } = process.env;
          const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '(not run)';

          const plan = read(planFile);
          const policy = read(policyFile);
          const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['(no summary line)'])[0];

          const maxPlan = 55000; // GitHub comments cap at 65,536 characters
          const planBody = plan.length > maxPlan
            ? plan.slice(0, maxPlan) + '\n... (truncated, see the job log for the full plan)'
            : plan;

          const body = [
            marker,
            `### ${title}`,
            `**${summary}**`,
            '',
            '#### Policy check (Conftest)',
            '```',
            policy.trim(),
            '```',
            '',
            '<details><summary>Full plan</summary>',
            '',
            '```',
            planBody,
            '```',
            '</details>',
            '',
            `_Commit ${context.sha.slice(0, 7)}, run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            ...context.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find((c) => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
          }
