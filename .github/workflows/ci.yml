name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8" # keep in sync with required_version in terraform/versions.tf

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # No AWS credentials here on purpose -- this only checks that the
      # config is syntactically valid and internally consistent, it never
      # talks to a real AWS account (no plan/apply in CI yet).
      - name: terraform init (no backend, no AWS calls)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  # Only runs on pushes to main -- the IAM role's trust policy is scoped to
  # ref:refs/heads/main, so a pull_request run (different sub claim, and
  # possibly from a fork) could not assume it anyway even if this ran.
  terraform-plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      # Temporary debug step: print exactly what GitHub's OIDC token will
      # assert for this run, so the IAM trust policy's `sub` condition can
      # be matched character-for-character instead of guessed. Remove once
      # the role assumption below succeeds.
      - name: debug OIDC context
        run: |
          echo "github.repository = ${{ github.repository }}"
          echo "github.ref = ${{ github.ref }}"
          echo "expected sub = repo:${{ github.repository }}:ref:${{ github.ref }}"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::197285016437:role/sa-portfolio-github-actions-ci
          aws-region: us-east-1

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: terraform plan -no-color

  app-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
