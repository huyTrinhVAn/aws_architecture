name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Not a secret: the provider only accepts tokens from this repository.
  # Output `workload_identity_provider` of gcp-bootstrap.
  GCP_WIF_PROVIDER: projects/682478392180/locations/global/workloadIdentityPools/github/providers/github-oidc

jobs:
  terraform-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/aws-dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8" # keep in sync with required_version in envs/aws-dev/versions.tf

      # From the repo root, so the shared modules are format-checked too,
      # not just the environment that calls them.
      - name: terraform fmt
        working-directory: .
        run: terraform fmt -check -recursive envs modules gcp-bootstrap

      # No AWS credentials here on purpose -- this only checks that the
      # config is syntactically valid and internally consistent, it never
      # talks to a real AWS account.
      - name: terraform init (no backend, no AWS calls)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      # Same offline check for the GCP roots. -backend=false also means
      # terraform_remote_state is never read, so no GCP credentials needed.
      - name: terraform validate (GCP roots)
        working-directory: .
        run: |
          for dir in gcp-bootstrap envs/gcp-dev; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  # Static scan of the .tf files against Checkov's built-in rules. Any
  # failed check fails the job (Checkov exits non-zero), which blocks the
  # PR. Accepted risks are skipped inline on the resource, with a reason,
  # so every exception is reviewed like any other code change.
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov==3.3.30

      # One run per directory: a multi-directory run only scans the first
      # one (see .checkov.yaml). Every directory is scanned even if an
      # earlier one fails, so the log shows all findings at once.
      - name: Checkov scan
        run: |
          status=0
          for dir in envs modules gcp-bootstrap; do
            echo "::group::checkov $dir"
            checkov --config-file .checkov.yaml -d "$dir" || status=1
            echo "::endgroup::"
          done
          exit $status

  # The custom Rego policies are code too: formatted, and unit-tested
  # against hand-written plans (including deliberately bad ones) before
  # they're trusted to gate real plans.
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-conftest

      - name: Rego format check
        run: conftest fmt --check policy

      - name: Policy unit tests
        run: conftest verify --policy policy

  # Plans on every PR (and on main), runs the custom policies against the
  # plan JSON, and posts the plan as a PR comment for review. Uses the
  # read-only CI role. Fork PRs are skipped: GitHub never issues them an
  # OIDC token, so they couldn't assume the role anyway.
  terraform-plan:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: terraform-check
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
      pull-requests: write # to post the plan comment
    defaults:
      run:
        shell: bash # explicit shell turns on pipefail, so `| tee` can't hide a failure
        working-directory: envs/aws-dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false # raw stdout, so `terraform show -json > file` is clean JSON

      - uses: ./.github/actions/setup-conftest

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::197285016437:role/sa-portfolio-github-actions-ci
          aws-region: us-east-1

      - name: terraform init
        run: terraform init -input=false

      # -refresh=false on purpose: a full refresh needs to read every
      # resource's live value, and for aws_secretsmanager_secret_version
      # that Read *is* a secretsmanager:GetSecretValue call. Granting the
      # read-only CI role permission to read actual secret contents would
      # undercut the whole point of keeping it read-only. Trade-off: this
      # plan reflects state as of the last apply, not a live re-check of
      # every resource. -lock-timeout waits out a concurrent PR/main plan
      # holding the state lock instead of failing immediately.
      - name: terraform plan
        id: plan
        run: terraform plan -input=false -no-color -refresh=false -lock-timeout=5m -out=tfplan

      - name: Render plan
        run: |
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Policy check (Conftest)
        run: conftest test plan.json --policy ../../policy --all-namespaces --no-color | tee conftest.txt

      # always(): the comment is posted even when the policy check fails,
      # so the author sees both the plan and exactly which policy denied it.
      # Updates one comment per PR instead of adding a new one every push.
      - name: Comment plan on PR
        if: always() && github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: ./.github/actions/plan-comment
        with:
          marker: "<!-- terraform-plan-comment -->"
          title: "Terraform plan: AWS (envs/aws-dev)"
          plan-file: envs/aws-dev/plan.txt
          policy-file: envs/aws-dev/conftest.txt

  # Applies main to AWS, but only after a human approves the run: the job
  # targets the "production" GitHub Environment, which has a required
  # reviewer. The apply role's trust policy only accepts the
  # environment:production OIDC claim, so AWS itself refuses any job that
  # didn't go through that gate.
  #
  # Off until ENABLE_TERRAFORM_APPLY=true is set as a repo variable --
  # referencing an environment that doesn't exist yet makes GitHub
  # silently create it *without* protection rules, so the switch is only
  # flipped once the environment's reviewer is configured.
  terraform-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_TERRAFORM_APPLY == 'true'
    needs: [terraform-check, checkov, policy-tests, terraform-plan]
    runs-on: ubuntu-latest
    environment: production
    # Never cancel an apply halfway; queue the next one behind it instead.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: envs/aws-dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - uses: ./.github/actions/setup-conftest

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::197285016437:role/sa-portfolio-github-actions-apply
          aws-region: us-east-1

      - name: terraform init
        run: terraform init -input=false

      # A fresh plan rather than the PR job's plan file: a saved plan holds
      # secret values (the DB password) in plaintext, and workflow artifacts
      # are readable by anyone with read access to the repo. Re-running the
      # policy check below means the exact plan being applied is gated too.
      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Policy check (Conftest)
        run: |
          terraform show -json tfplan > plan.json
          conftest test plan.json --policy ../../policy --all-namespaces --no-color

      - name: terraform apply
        run: terraform apply -input=false -no-color tfplan

  # Same flow as terraform-plan, for GCP. Authenticates through Workload
  # Identity Federation (gcp-bootstrap/wif.tf) as tf-plan: read-only on
  # the shared/ and dev/ folders, and on the state bucket it can only
  # write lock files. No service account key exists anywhere.
  gcp-plan:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: terraform-check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash
        working-directory: envs/gcp-dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - uses: ./.github/actions/setup-conftest

      # Exchanges the job's GitHub OIDC token for a ~1h token of tf-plan.
      # GCP accepts it only because the token's repository_id matches the
      # provider's attribute condition.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: tf-plan@sa-seed-d463.iam.gserviceaccount.com

      - name: terraform init
        run: terraform init -input=false

      # Full refresh here, unlike the AWS plan: nothing in this root reads
      # secret values yet. Revisit when Cloud SQL / Secret Manager land.
      - name: terraform plan
        id: plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Render plan
        run: |
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Policy check (Conftest)
        run: conftest test plan.json --policy ../../policy --all-namespaces --no-color | tee conftest.txt

      - name: Comment plan on PR
        if: always() && github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: ./.github/actions/plan-comment
        with:
          marker: "<!-- terraform-plan-comment-gcp-dev -->"
          title: "Terraform plan: GCP (envs/gcp-dev)"
          plan-file: envs/gcp-dev/plan.txt
          policy-file: envs/gcp-dev/conftest.txt

  # Same gates as terraform-apply: push to main, every check green, its own
  # switch, and a human approval through the "production" Environment.
  # GCP enforces that last gate too: tf-apply can only be impersonated by
  # a token carrying environment=production (gcp-bootstrap/wif.tf).
  #
  # Separate switch from AWS, because the AWS stack is destroyed between
  # sessions while the GCP network stays up.
  gcp-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GCP_APPLY == 'true'
    needs: [terraform-check, checkov, policy-tests, gcp-plan]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: gcp-apply-dev
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: envs/gcp-dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - uses: ./.github/actions/setup-conftest

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: tf-apply@sa-seed-d463.iam.gserviceaccount.com

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Policy check (Conftest)
        run: |
          terraform show -json tfplan > plan.json
          conftest test plan.json --policy ../../policy --all-namespaces --no-color

      - name: terraform apply
        run: terraform apply -input=false -no-color tfplan

  app-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  # Builds a self-contained bundle (app code + offline-installable
  # dependency wheels) and uploads it to S3, since the app subnet has no
  # internet access to reach PyPI at instance-boot time. `pip download`
  # doesn't need to run on the target architecture -- it just fetches
  # prebuilt wheels matching --platform from PyPI's index, so this works
  # fine on the runner's own x86_64 Linux even though EC2 runs ARM64.
  #
  # Runs only after terraform-apply succeeds: the deploy bucket, the deploy
  # role and the ASG only exist once the stack is applied. When apply is
  # skipped (switch off) or rejected, this job is skipped too instead of
  # failing against infrastructure that isn't there.
  build-and-deploy-app:
    if: github.ref == 'refs/heads/main'
    needs: [app-tests, terraform-apply]
    # Pinned, unlike the other jobs: the bundle must be built by a real
    # Python 3.9 to match AL2023's python3 (pip evaluates dependency markers
    # with the host interpreter, see app/requirements.txt), and
    # actions/setup-python has no 3.9 build for ubuntu-latest (26.04).
    # Long-term fix: run the app on AL2023's python3.11 package instead.
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9" # matches AL2023's actual system python3 (3.9.25), not an arbitrary choice

      - name: Download dependency wheels for Graviton (ARM64) Linux
        working-directory: app
        run: |
          mkdir -p vendor
          pip download \
            --platform manylinux2014_aarch64 \
            --python-version 3.9 \
            --only-binary=:all: \
            -r requirements.txt \
            -d vendor/

      - name: Build deployment bundle
        working-directory: app
        run: |
          zip -r ../bundle.zip . \
            -x ".venv/*" "__pycache__/*" ".pytest_cache/*" "test_app.py" "requirements-dev.txt"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::197285016437:role/sa-portfolio-github-actions-deploy
          aws-region: us-east-1

      # Bucket name is sa-portfolio-deploy-<account id>, see modules/aws-storage/main.tf.
      - name: Upload bundle to S3
        run: aws s3 cp bundle.zip s3://sa-portfolio-deploy-197285016437/bundle.zip

      # Instances only read the bundle at boot, so replace them to pick up
      # the new one. MinHealthyPercentage=50 with 2 instances means one is
      # replaced at a time while the other keeps serving; InstanceWarmup
      # covers user_data's dnf/pip install before the next one is touched.
      # The refresh runs asynchronously -- follow it in the EC2 console
      # under Auto Scaling groups -> Instance refresh.
      - name: Roll out the new bundle (instance refresh)
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name sa-portfolio-asg \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180}'
