name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8" # keep in sync with required_version in terraform/versions.tf

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # No AWS credentials here on purpose -- this only checks that the
      # config is syntactically valid and internally consistent, it never
      # talks to a real AWS account (no plan/apply in CI yet).
      - name: terraform init (no backend, no AWS calls)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  # Only runs on pushes to main -- the IAM role's trust policy is scoped to
  # ref:refs/heads/main, so a pull_request run (different sub claim, and
  # possibly from a fork) could not assume it anyway even if this ran.
  terraform-plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::197285016437:role/sa-portfolio-github-actions-ci
          aws-region: us-east-1

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: terraform plan -no-color

  app-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  # Builds a self-contained bundle (app code + offline-installable
  # dependency wheels) and uploads it to S3, since the app subnet has no
  # internet access to reach PyPI at instance-boot time. `pip download`
  # doesn't need to run on the target architecture -- it just fetches
  # prebuilt wheels matching --platform from PyPI's index, so this works
  # fine on the runner's own x86_64 Linux even though EC2 runs ARM64.
  build-and-deploy-app:
    if: github.ref == 'refs/heads/main'
    needs: app-tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download dependency wheels for Graviton (ARM64) Linux
        working-directory: app
        run: |
          mkdir -p vendor
          pip download \
            --platform manylinux2014_aarch64 \
            --python-version 3.12 \
            --only-binary=:all: \
            -r requirements.txt \
            -d vendor/

      - name: Build deployment bundle
        working-directory: app
        run: |
          zip -r ../bundle.zip . \
            -x ".venv/*" "__pycache__/*" ".pytest_cache/*" "test_app.py" "requirements-dev.txt"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::197285016437:role/sa-portfolio-github-actions-deploy
          aws-region: us-east-1

      - name: Upload bundle to S3
        run: aws s3 cp bundle.zip s3://sa-portfolio-deploy-57440759/bundle.zip
