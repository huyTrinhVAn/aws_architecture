name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8" # keep in sync with required_version in terraform/versions.tf

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # No AWS credentials here on purpose -- this only checks that the
      # config is syntactically valid and internally consistent, it never
      # talks to a real AWS account (no plan/apply in CI yet).
      - name: terraform init (no backend, no AWS calls)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  app-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
